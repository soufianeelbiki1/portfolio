name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Typecheck and build static output
        run: npm run typecheck && npm run build

      - name: Check committed output matches source
        run: git diff --exit-code -- index.html assets

      - name: Check hydrated interactions and reduced motion
        run: node --test tests/interactions.test.mjs

      - name: Compile tests
        run: python -m compileall -q tests

      - name: Validate portfolio
        run: python -m unittest discover -s tests -v
